<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="description" content="แอปอ่านแบบก่อสร้าง 2D / 3D / 4D ใช้งานออฟไลน์">
<title>อ่านแบบ 2D·3D·4D</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="อ่านแบบ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<style>
  #featBar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px;
    background: #f5f7fa; border-bottom: 1px solid #dde3ea;
    font-size: 12px; align-items: center;
  }
  #featBar .fb {
    border: 1px solid #c5d0dc; background: #fff; border-radius: 8px;
    padding: 4px 8px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
  }
  #featBar .fb:hover { background: #eef3f9; }
  #featBar .fb.on { background: #1565c0; color: #fff; border-color: #1565c0; }
  #featBar .fb .ab { opacity: .75; font-size: 10px; font-weight: 600; }
  #featBar .fb.on .ab { opacity: 1; }
  #featBar .fb.ready { border-color: #2e7d32; }
  #featBar .fb.ready.on { background: #2e7d32; border-color: #2e7d32; }
  #featBar .fb.soon { opacity: .85; }
  #featToast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: #1c1917; color: #fff; padding: 10px 16px; border-radius: 10px;
    z-index: 9999; font-size: 13px; max-width: 90vw; display: none;
  }
  #arOverlay {
    display: none; position: fixed; inset: 0; z-index: 10000;
    pointer-events: none;
  }
  #arOverlay.active { display: block; }
  #arPanel {
    pointer-events: auto; position: absolute; left: 50%; bottom: 24px;
    transform: translateX(-50%); background: rgba(28,25,23,.92);
    color: #fff; border-radius: 14px; padding: 12px 16px; min-width: 260px;
    max-width: 92vw; box-shadow: 0 8px 28px rgba(0,0,0,.35);
    font-size: 13px; text-align: center;
  }
  #arPanel h3 { margin: 0 0 6px; font-size: 15px; }
  #arPanel p { margin: 0 0 10px; opacity: .9; line-height: 1.4; }
  #arPanel .ar-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #arPanel button {
    border: 0; border-radius: 10px; padding: 8px 14px; font-size: 13px;
    cursor: pointer; background: #fff; color: #1c1917; font-weight: 600;
  }
  #arPanel button.danger { background: #e53935; color: #fff; }
  #arPanel button.secondary { background: #374151; color: #fff; }
  #arBadge {
    pointer-events: none; position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%); background: rgba(46,125,50,.95);
    color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
<header id="top">
  <div class="brand">📐 <b data-en="Plan Reader">อ่านแบบ</b> <span>2D·3D·4D</span></div>
  <nav id="modes">
    <button data-mode="2d" class="active">2D</button>
    <button data-mode="3d">3D</button>
    <button data-mode="4d">4D</button>
    <button data-mode="boq" data-en="BOQ">ถอดปริมาณ</button>
  </nav>
  <div class="actions">
    <button id="btnNewJob" class="newjob-btn" title="เริ่มงานใหม่ / New job">🆕 <span data-en="New job">เริ่มงานใหม่</span></button>
    <button id="btnWorkType" class="wt-btn" title="เลือกประเภทงาน / Work type">🏗️ <span class="wt-lbl" data-en="Work type">เลือกประเภทงาน</span> <b id="wtChip" class="wt-chip"></b></button>
    <button id="btnFile">📂 <span data-en="File">ไฟล์</span></button>
    <button id="btnLearn" class="learn-btn" title="โหมดเรียนรู้ / Learning mode">🎓 <span data-en="Learn">โหมดเรียนรู้</span></button>
    <button id="btnSave" class="save-btn" title="เซฟลงเครื่อง / Save to device">💾 <span data-en="Save">เซฟลงเครื่อง</span></button>
    <button id="btnPrint" class="print-btn" title="พิมพ์ / Print">🖨️ <span data-en="Print">พิมพ์</span></button>
    <button id="btnUndo" title="เลิกทำ (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="ทำซ้ำ (Ctrl+Y)">↷</button>
    <select id="levelSel" title="ชั้น / Level"></select>
    <button id="btnTheme" title="ธีมมืด/สว่าง">🌓</button>
    <button id="btnLang" title="ภาษา / Language">EN</button>
    <button id="offBadge" class="off-badge loading" title="ใช้งานออฟไลน์ / Offline">⏳ กำลังเตรียมใช้ออฟไลน์</button>
    <button id="btnHelp" title="วิธีใช้">❓</button>
    <button id="btnPanel" class="mobile-only" title="แผงตั้งค่า">☰</button>
  </div>
</header>

<div id="featBar" role="toolbar" aria-label="ฟีเจอร์เพิ่มเติม">
  <button type="button" class="fb soon" data-feat="dwg" title="เปิดไฟล์ DWG โดยตรง">📄 DWG <span class="ab">DWG</span></button>
  <button type="button" class="fb soon" data-feat="ocr" title="OCR ภาษาไทยและอังกฤษ">🔤 OCR ไทย <span class="ab">OCR</span></button>
  <button type="button" class="fb soon" data-feat="check" title="ตรวจอัตโนมัติ / Clash">✅ ตรวจอัตโนมัติ <span class="ab">Check</span></button>
  <button type="button" class="fb ready" data-feat="glb" title="ส่งออกโมเดล 3D เป็น GLB/OBJ">🧊 ส่งออก 3D <span class="ab">GLB</span></button>
  <button type="button" class="fb ready" data-feat="ar" id="btnAR" title="โหมด AR">📱 โหมด AR <span class="ab">AR</span></button>
  <button type="button" class="fb ready" data-feat="diff" title="เปรียบเทียบแบบเก่า-ใหม่">🔄 เปรียบเทียบ <span class="ab">Diff</span></button>
  <button type="button" class="fb soon" data-feat="layer" title="จัดการ Layer / Block">📚 เลเยอร์ <span class="ab">Layer</span></button>
  <button type="button" class="fb soon" data-feat="symbol" title="คลังสัญลักษณ์ส่วนตัว">🔣 คลังสัญลักษณ์ <span class="ab">Symbol</span></button>
  <button type="button" class="fb soon" data-feat="cloud" title="ซิงค์และแชร์โปรเจกต์">☁️ ซิงค์คลาวด์ <span class="ab">Cloud</span></button>
  <button type="button" class="fb soon" data-feat="perf" title="โหมดประสิทธิภาพแบบใหญ่">⚡ ประสิทธิภาพ <span class="ab">Perf</span></button>
</div>

<div id="stepBar" class="stepbar">
  <button id="stp1" class="stp"><b>1</b> <span data-en="Open drawing">เปิดแบบ</span></button><i class="stp-ar">→</i>
  <button id="btnTo3d" class="stp cv-btn"><b>2</b> 🧊 <span data-en="Convert 2D → 3D">แปลง 2D → 3D</span></button><i class="stp-ar">→</i>
  <button id="btnTo4d" class="stp cv-btn cv4"><b>3</b> 📅 <span data-en="Convert 3D → 4D">แปลง 3D → 4D</span></button><i class="stp-ar">→</i>
  <button id="btnAsm" class="stp cv-btn cv-asm"><b>4</b> 🧩 <span data-en="Assemble model">ประกอบแบบเป็นโมเดล</span></button>
  <span id="stpHint" class="small"></span>
</div>
<div id="fileMenu" class="menu hidden">
  <label class="mi">📷 <span data-en="Take photo of drawing">ถ่ายรูปแบบ (กล้อง)</span><input type="file" accept="image/*" capture="environment" id="inCamera" hidden></label>
  <label class="mi">🖼️ <span data-en="Pick from photo gallery">เลือกรูปจากคลังภาพ</span><input type="file" accept="image/*" id="inGallery" hidden></label>
  <button class="mi" id="miScan">📄 <span data-en="Scan document (flatten photo)">สแกนเอกสาร (ปรับรูปถ่ายให้ตรง)</span></button>
  <label class="mi">🗂️ <span data-en="Open image file (JPG/PNG)">เปิดไฟล์รูปภาพ (JPG/PNG)</span><input type="file" accept="image/*,.jpg,.jpeg,.png" id="inImage" hidden></label>
  <label class="mi">📄 <span data-en="Open PDF">เปิดไฟล์ PDF</span><input type="file" accept="application/pdf,.pdf" id="inPdf" hidden></label>
  <label class="mi">📐 <span data-en="Open DXF (CAD)">เปิดไฟล์ DXF (CAD)</span><input type="file" accept=".dxf,image/vnd.dxf,application/dxf" id="inDxf" hidden></label>
  <label class="mi">🏗️ <span data-en="Open IFC (BIM)">เปิดไฟล์ IFC (BIM)</span><input type="file" accept=".ifc" id="inIfc" hidden></label>
  <hr>
  <button class="mi" id="miNew">🆕 <span data-en="New job (clear current work)">เริ่มงานใหม่ (ล้างงานที่กำลังตรวจ)</span></button>
  <button class="mi" id="miSave">💾 <span data-en="Save in this device">บันทึกในเครื่อง</span></button>
  <button class="mi" id="miOpen">📁 <span data-en="Open saved project">เปิดโปรเจกต์ที่บันทึกไว้</span></button>
  <label class="mi">📂 <span data-en="Open saved file (.dwgapp / .html)">เปิดไฟล์ที่เซฟไว้ (.dwgapp / .html)</span><input type="file" accept=".dwgapp,.json,.html,.htm,application/json,text/html" id="inSaved" hidden></label>
  <button class="mi" id="miSaved">🗂️ <span data-en="Saved files">ไฟล์ที่เซฟไว้</span></button>
  <button class="mi" id="miExport">⬇️ <span data-en="Export project file (.json)">ส่งออกไฟล์โปรเจกต์ (.json)</span></button>
  <label class="mi">⬆️ <span data-en="Import project file (.json)">นำเข้าไฟล์โปรเจกต์ (.json)</span><input type="file" accept=".json,application/json" id="inJson" hidden></label>
  <button class="mi" id="miSample">🧪 <span data-en="Load sample plan">โหลดแบบตัวอย่าง</span></button>
  <hr>
  <button class="mi" id="miBackup">🛟 <span data-en="Backup all data">สำรองข้อมูลทั้งหมด</span></button>
  <label class="mi">♻️ <span data-en="Restore from backup">กู้คืนจากไฟล์สำรอง</span><input type="file" accept=".json,.dabackup,application/json" id="inBackup" hidden></label>
  <button class="mi" id="miPin">🔒 <span data-en="Set / change PIN">ตั้ง/เปลี่ยนรหัส PIN</span></button>
  <button class="mi" id="miLock">🔐 <span data-en="Lock app now">ล็อกแอปตอนนี้</span></button>
  <hr><div class="mi-h">⚙️ <span data-en="Settings">ตั้งค่า</span></div>
  <button class="mi danger" id="miWipe">🧹 <span data-en="Erase all data on this device">ล้างข้อมูลทั้งหมดในเครื่อง</span></button>
</div>
<main>
  <aside id="tools"></aside>
  <section id="view">
    <div id="v2d"><canvas id="c2d"></canvas></div>
    <div id="v3d" class="hidden"></div>
    <div id="walkPad" class="hidden">
      <span></span><button data-walk="1,0">▲</button><span></span>
      <button data-walk="0,-1">◀</button><button data-walk="-1,0">▼</button><button data-walk="0,1">▶</button>
    </div>
    <div id="boq" class="hidden"></div>
    <button id="asmFab" class="asm-fab hidden">🧩 <span data-en="Assemble model">ประกอบแบบเป็นโมเดล</span> <b id="asmFabN"></b></button>
    <div id="asmBar" class="asm-bar hidden"><span id="asmBarTxt"></span><button data-asmv="3d">🧊 3D</button><button data-asmv="4d">📅 4D</button><button data-asmv="tiles">🗂️ <span data-en="Sheets">แบบทั้งหมด</span></button></div>
    <div id="welcome" class="welcome">
      <div class="card">
        <h2 style="margin-top:0" data-en="Start reading a drawing">เริ่มอ่านแบบ</h2>
        <p class="small" data-en="Take a photo or open an image, PDF or DXF file. Everything works offline.">ถ่ายรูปแบบ หรือเปิดไฟล์รูปภาพ / PDF / DXF — ทำงานออฟไลน์ทั้งหมด ข้อมูลไม่ออกจากเครื่อง</p>
        <div class="bigbtns">
          <button class="big primary" id="wCamera"><span class="ic">📷</span><span data-en="Take photo of drawing">ถ่ายรูปแบบ</span></button>
          <button class="big" id="wGallery"><span class="ic">🖼️</span><span data-en="Pick from photo gallery">เลือกรูปจากคลังภาพ</span></button>
          <button class="big" id="wScan"><span class="ic">📄</span><span data-en="Scan document">สแกนเอกสาร</span></button>
          <button class="big" id="wOpen"><span class="ic">📂</span><span data-en="Open drawing file (PDF/DXF/image)">เปิดไฟล์แบบ</span></button>
          <button class="big wt-big" id="wWorkType"><span class="ic">🏗️</span><span data-en="Choose work type (piping, petroleum…)">เลือกประเภทงาน (ท่อ ปิโตรเลียม ฯลฯ)</span></button>
          <button class="big" id="wSample"><span class="ic">🧪</span><span data-en="Try sample plan">ลองแบบตัวอย่าง</span></button>
        </div>
      </div>
    </div>
    <div id="cvFloat" class="cv-float hidden"><button id="cvBig" class="cv-big"></button><div id="cvBadge" class="cv-badge hidden"></div></div>
    <div id="hint"></div>
    <div id="dropHint" data-en="Drop file here">วางไฟล์ที่นี่</div>
  </section>
  <aside id="panel"></aside>
</main>
<section id="timeline" class="hidden">
  <div class="tl-ctrl">
    <button id="tlPlay" title="เล่น / Play">▶</button>
    <input type="range" id="tlSlider" min="0" max="1" value="0" step="1">
    <span id="tlDate"></span>
    <select id="tlSpeed" title="ความเร็ว"><option value="1">1 วัน/เฟรม</option><option value="3" selected>3 วัน/เฟรม</option><option value="7">7 วัน/เฟรม</option></select>
    <span class="legend"><span><i style="background:#43a047"></i><b data-en="Done">เสร็จแล้ว</b></span><span><i style="background:#fb8c00"></i><b data-en="In progress">กำลังทำ</b></span><span><i style="background:#90a4ae"></i><b data-en="Not started">ยังไม่เริ่ม</b></span><span><i style="background:#1e88e5"></i><b data-en="Testing">กำลังทดสอบ</b></span></span>
    <span id="tlStats" class="small"></span>
  </div>
  <div id="gantt"></div>
</section>
<footer id="status"><span id="stCoords"></span><span id="stScale"></span><span id="stInfo"></span><span id="stOffline"></span></footer>
<div id="modal" class="hidden"><div class="box"><div class="mhead"><b id="mTitle"></b><button id="mClose">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="featToast"></div>

<!-- แผงควบคุมโหมด AR -->
<div id="arOverlay">
  <div id="arBadge">โหมด AR ทำงานอยู่</div>
  <div id="arPanel">
    <h3>📱 โหมด AR</h3>
    <p id="arHelp">เล็งกล้องไปที่พื้น/ผนัง แล้วแตะหน้าจอเพื่อวางโมเดล</p>
    <div class="ar-row">
      <button type="button" class="secondary" id="arScaleDown">ย่อ −</button>
      <button type="button" class="secondary" id="arScaleUp">ขยาย +</button>
      <button type="button" class="danger" id="arStop">หยุด AR</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<input type="file" id="inMulti" multiple accept="image/*,.jpg,.jpeg,.png,.pdf,application/pdf,.dxf" hidden>
<input type="file" id="inMultiCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inAny" accept="image/*,.jpg,.jpeg,.png,.pdf,application/pdf,.dxf,.dwg,.ifc,.json,.dwgapp,application/json" hidden>
<script>window.PDF_WORKER_SRC='vendor/pdf.worker.min.js';window.SW_URL='sw.js';</script>
<script src="app.js"></script>
<script>
(function () {
  var msgs = {
    dwg: 'DWG: ยังต้องแปลงเป็น DXF ก่อน (ฟีเจอร์เต็มรูปแบบอยู่ระหว่างพัฒนา)',
    ocr: 'OCR ไทย/อังกฤษ: มีพื้นฐานแล้ว กำลังปรับปรุงความแม่นยำ',
    check: 'ตรวจอัตโนมัติ (Check): มีบางส่วนในโค้ด กำลังทำให้เสถียร',
    glb: 'ส่งออก 3D (GLB): กำลังเรียกฟังก์ชันส่งออก…',
    ar: 'โหมด AR: กำลังเริ่ม…',
    diff: 'เปรียบเทียบแบบ (Diff): กำลังเรียกฟังก์ชันเปรียบเทียบ…',
    layer: 'เลเยอร์ (Layer): มีพื้นฐานแล้ว กำลังขยายการจัดการ Block',
    symbol: 'คลังสัญลักษณ์ (Symbol): สอนสัญลักษณ์ได้แล้ว กำลังเพิ่มคลังส่วนตัว',
    cloud: 'ซิงค์คลาวด์ (Cloud): ตอนนี้เก็บในเครื่องเท่านั้น',
    perf: 'ประสิทธิภาพ (Perf): โหมดเร่งความเร็วสำหรับแบบใหญ่ (กำลังพัฒนา)'
  };
  var state = {};
  var arSession = null;
  var arScale = 1 / 50;

  function show(t) {
    var el = document.getElementById('featToast');
    if (!el) return;
    el.textContent = t;
    el.style.display = 'block';
    clearTimeout(show._t);
    show._t = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }

  function callApp(paths) {
    var a = window.__app;
    if (!a) return false;
    for (var i = 0; i < paths.length; i++) {
      var p = paths[i], o = a, ok = true;
      for (var j = 0; j < p.length; j++) {
        if (o == null) { ok = false; break; }
        o = o[p[j]];
      }
      if (ok && typeof o === 'function') { try { o(); return true; } catch (e) {} }
    }
    return false;
  }

  function ensure3D() {
    try {
      if (window.__app && typeof window.__app.setMode === 'function') {
        window.__app.setMode('3d');
        return true;
      }
      var b = document.querySelector('button[data-mode="3d"]');
      if (b) { b.click(); return true; }
    } catch (e) {}
    return false;
  }

  function hasModel() {
    try {
      if (window.__app && typeof window.__app.hasDrawing === 'function') return !!window.__app.hasDrawing();
      if (window.__app && window.__app.S && window.__app.S.project) return true;
    } catch (e) {}
    return false;
  }

  function showARUI(mode) {
    var ov = document.getElementById('arOverlay');
    var help = document.getElementById('arHelp');
    ov.classList.add('active');
    if (mode === 'webxr') {
      help.textContent = 'WebXR: เล็งวงแหวนบนพื้น แล้วแตะเพื่อวางโมเดล · ใช้มือถือที่รองรับ AR');
    } else {
      help.textContent = 'โหมดกล้อง: หมุนเครื่องเพื่อมองรอบ · ปรับขนาดด้วยปุ่มด้านล่าง';
    }
  }

  function hideARUI() {
    document.getElementById('arOverlay').classList.remove('active');
    var btn = document.getElementById('btnAR');
    if (btn) btn.classList.remove('on');
    state.ar = false;
    arSession = null;
  }

  async function startAR() {
    if (arSession && typeof arSession.stop === 'function') {
      try { arSession.stop(); } catch (e) {}
      hideARUI();
      show('หยุดโหมด AR แล้ว');
      return;
    }

    if (!hasModel()) {
      show('กรุณาเปิดแบบและแปลงเป็น 3D ก่อน แล้วค่อยกดโหมด AR');
      return;
    }

    ensure3D();
    await new Promise(function (r) { setTimeout(r, 200); });

    var startFn = window.__app && window.__app.startAR;
    if (typeof startFn !== 'function') {
      show('ไม่พบฟังก์ชัน AR ในแอป');
      return;
    }

    try {
      show('กำลังขอสิทธิ์กล้อง / AR…');
      var session = await startFn({
        scale: arScale,
        onEnd: function () {
          hideARUI();
          show('ปิดโหมด AR แล้ว');
        },
        overlay: document.getElementById('arOverlay')
      });
      arSession = session || { stop: function () {} };
      var mode = (session && session.mode) || 'camera';
      showARUI(mode);
      document.getElementById('btnAR').classList.add('on');
      state.ar = true;
      show(mode === 'webxr'
        ? 'เปิด WebXR AR แล้ว — แตะพื้นเพื่อวางโมเดล'
        : 'เปิดโหมดกล้อง AR แล้ว — หมุนเครื่องเพื่อดู');
    } catch (err) {
      console.error(err);
      var msg = (err && err.message) ? String(err.message) : 'ไม่สามารถเปิด AR ได้';
      if (/permission|NotAllowed|denied/i.test(msg)) {
        show('ไม่ได้รับอนุญาตใช้กล้อง — อนุญาตในตั้งค่าเบราว์เซอร์แล้วลองใหม่');
      } else if (/secure|https|Secure/i.test(msg)) {
        show('AR ต้องเปิดผ่าน HTTPS (GitHub Pages รองรับอยู่แล้ว)');
      } else {
        show('เปิด AR ไม่สำเร็จ: ' + msg);
      }
      hideARUI();
    }
  }

  document.getElementById('arStop').addEventListener('click', function () {
    if (arSession && typeof arSession.stop === 'function') {
      try { arSession.stop(); } catch (e) {}
    }
    hideARUI();
    show('หยุดโหมด AR แล้ว');
  });

  document.getElementById('arScaleUp').addEventListener('click', function () {
    arScale = Math.min(arScale * 1.25, 1);
    show('ขยายโมเดล (สเกล ≈ ' + arScale.toFixed(3) + ') — เปิด AR ใหม่เพื่อใช้ค่านี้');
  });
  document.getElementById('arScaleDown').addEventListener('click', function () {
    arScale = Math.max(arScale / 1.25, 0.005);
    show('ย่อโมเดล (สเกล ≈ ' + arScale.toFixed(3) + ') — เปิด AR ใหม่เพื่อใช้ค่านี้');
  });

  document.getElementById('featBar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-feat]');
    if (!btn) return;
    var f = btn.getAttribute('data-feat');

    if (f === 'ar') {
      startAR();
      return;
    }

    state[f] = !state[f];
    btn.classList.toggle('on', !!state[f]);
    var ran = false;
    if (f === 'glb') ran = callApp([['exp', 'glb'], ['exp', 'obj']]);
    if (f === 'diff') ran = callApp([['compareSheets']]);
    if (f === 'check') ran = callApp([['clashCheck'], ['runChecks']]);
    show(msgs[f] + (ran ? ' ✓' : ''));
  });
})();
</script>
</body>
</html>
